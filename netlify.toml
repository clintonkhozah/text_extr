[build]
  base = "."
  command = "npm run install:all && npm run build:web"
  publish = "frontend/dist"

[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = [
    "@supabase/supabase-js",
    "cors",
    "dotenv",
    "express",
    "mammoth",
    "pdf-parse",
    "serverless-http",
    "swagger-jsdoc",
    "swagger-ui-express",
    "uuid",
    "zod"
  ]
  included_files = ["node_modules/**"]

[dev]
  command = "npm run dev --prefix frontend -- --host 127.0.0.1 --port 3001"
  targetPort = 3001
  port = 8888
